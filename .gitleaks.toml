title = "RenTrek: built-in rules plus low-entropy configuration credentials"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "rentrek-credential-assignment"
description = "Credential defaults in JSON, env, YAML or C# (including low entropy secrets)"
regex = '''(?i)["']?(?:secretkey|jwt[_: -]?secret|apikey|api_key|clientsecret|client_secret|password|pwd|access_token|private_key)["']?[ \t]*[:=][ \t]*["']([^\s"';,}]{4,})'''
secretGroup = 1
[[rules.allowlists]]
description = "Explicit angle-bracket placeholders only; no path-wide config exceptions"
regexTarget = "secret"
regexes = ['''^<[^>]+>$''']

[[rules]]
id = "rentrek-connection-password"
description = "Password embedded in database connection strings"
regex = '''(?i)(?:password|pwd)\s*=\s*([^;\s"']{4,})'''
secretGroup = 1
[[rules.allowlists]]
description = "Explicit angle-bracket placeholders only"
regexTarget = "secret"
regexes = ['''^<[^>]+>$''', '''^<\[\^>\]\+>$''']

[[allowlists]]
description = "Literal documentation placeholders, not credentials; values only, never entire files"
regexTarget = "secret"
regexes = ['''^(?:TODO|<[^>]+>|string|\.\.\.)$''']

[[rules]]
id = "rentrek-env-credential"
description = "Low entropy secrets in environment assignments, including .NET double underscores"
regex = '''(?im)^[ \t]*(?:export[ \t]+)?(?:[a-z][a-z0-9]*__)*(?:secretkey|jwt_secret|api_key|apikey|client_secret|password|access_token|private_key)[ \t]*=[ \t]*["']?([^\s"'#]{4,})'''
secretGroup = 1
[[rules.allowlists]]
description = "Explicit environment placeholders"
regexTarget = "secret"
regexes = ['''^<[^>]+>$''']

[[allowlists]]
description = "Generated build/tool outputs only; do not exclude config, tests, docs or Git history"
paths = ['''(^|/)(bin|obj|artifacts|\.vs|node_modules)/''']
